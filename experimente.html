<!DOCTYPE html>
<html>
<head>
<title>fvaberah</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <img src="images/rsz_th.jpg"> <h1 class="center">Happy Calculator</h1> <img src="images/rsz_th.jpg">
    </div>

<input type="text" id="username" class="center" name="username" required minlength="1" maxlength="100" placeholder="Enter equation">

<div>
    <h3 class="center" id="hellothere"> </h3>
    <img id="yeehaw" src="images/dumb-smile.gif" alt="Status image" width="100" height="100" style="display: none; margin: 0 auto;">
</div>

<div class="butt">  
    <button id="1">1</button>
    <button id="2">2</button>
    <button id="3">3</button>
    <button id="4">4</button>
    <button id="5">5</button>
    <button id="6">6</button>
    <button id="7">7</button>
    <button id="8">8</button>
    <button id="9">9</button>
    <button id="0">0</button>
</div>

<div class="butt">
    <button id="-">-</button>
    <button id="+">+</button>
    <button id="/">/</button>
    <button id="*">*</button>
    <button id=",">,</button>
    <button id=")">)</button>
</div>

<div class="butt">
    <button id="sin">sin</button>
    <button id="cos">cos</button>
    <button id="tan">tan</button>
    <button id="mean">mean</button>
    <button id="median">median</button>
    <button id="mode">mode</button>
    <button id="clear" style="background-color: #ff4d4d; color: white;">C</button>
</div>

<div class="butt">
    <button id="run"> 
         <img src="images/OIP.webp" alt="Button Image" width="50" height="50"> 
         RUN
         <img src="images/OIP.webp" alt="Button Image" width="50" height="50"> 
    </button>
</div>

<div class="center" style="margin: 10px auto; text-align: center;">
    <label for="fileInput">Upload Calculation File (.txt): </label>
    <input type="file" id="fileInput" accept=".txt,.csv">
    <button id="read my file big boy">read my file now.</button>
</div>

<script>
// Number and symbol event listeners
document.getElementById("1").addEventListener("click", () => updateValue("1"));
document.getElementById("2").addEventListener("click", () => updateValue("2"));
document.getElementById("3").addEventListener("click", () => updateValue("3"));
document.getElementById("4").addEventListener("click", () => updateValue("4"));
document.getElementById("5").addEventListener("click", () => updateValue("5"));
document.getElementById("6").addEventListener("click", () => updateValue("6"));
document.getElementById("7").addEventListener("click", () => updateValue("7"));
document.getElementById("8").addEventListener("click", () => updateValue("8"));
document.getElementById("9").addEventListener("click", () => updateValue("9"));
document.getElementById("0").addEventListener("click", () => updateValue("0"));
document.getElementById("-").addEventListener("click", () => updateValue(" - "));
document.getElementById("+").addEventListener("click", () => updateValue(" + "));
document.getElementById("/").addEventListener("click", () => updateValue(" / "));
document.getElementById("*").addEventListener("click", () => updateValue(" * "));
document.getElementById(",").addEventListener("click", () => updateValue(", "));
document.getElementById(")").addEventListener("click", () => updateValue(")"));

// Special button event listeners
document.getElementById("sin").addEventListener("click", () => updateValue("sin("));
document.getElementById("cos").addEventListener("click", () => updateValue("cos("));
document.getElementById("tan").addEventListener("click", () => updateValue("tan("));
document.getElementById("mean").addEventListener("click", () => updateValue("mean("));
document.getElementById("median").addEventListener("click", () => updateValue("median("));
document.getElementById("mode").addEventListener("click", () => updateValue("mode("));

// Clear and Run buttons
document.getElementById("clear").addEventListener("click", clearCalculator);
document.getElementById("run").addEventListener("click", updateValues);

// Helper math functions for Trig (input in degrees)
function sin(deg) { return Math.sin(deg * (Math.PI / 180)); }
function cos(deg) { return Math.cos(deg * (Math.PI / 180)); }
function tan(deg) { return Math.tan(deg * (Math.PI / 180)); }

// Helper functions for Stats
function mean(...args) {
    const nums = args.flat().map(Number).filter(n => !isNaN(n));
    if (nums.length === 0) return 0;
    return nums.reduce((a, b) => a + b, 0) / nums.length;
}

function median(...args) {
    const nums = args.flat().map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
    if (nums.length === 0) return 0;
    const mid = Math.floor(nums.length / 2);
    if (nums.length % 2 !== 0) {
        return nums[mid];
    } else {
        return (nums[mid - 1] + nums[mid]) / 2;
    }
}

function mode(...args) {
    const nums = args.flat().map(Number).filter(n => !isNaN(n));
    if (nums.length === 0) return "No mode";
    const freq = {};
    let maxFreq = 0;
    let modes = [];
    nums.forEach(n => {
        freq[n] = (freq[n] || 0) + 1;
        if (freq[n] > maxFreq) maxFreq = freq[n];
    });
    for (let key in freq) {
        if (freq[key] === maxFreq) modes.push(Number(key));
    }
    return modes.length === nums.length ? "No mode" : modes.join(", ");
}

function updateValues() {
    const inputVal = document.getElementById("username").value;
    const result = solvetheequation(inputVal);
    
    if (result !== "error!error!error!") {
        document.getElementById("hellothere").innerText = result;
        document.getElementById("yeehaw").style.display = "none";
    }
}

function solvetheequation(expression) {
    let result;
    try {
        if (!expression || expression.trim() === "") throw new Error("Empty");
        result = eval(expression);
    } catch (e) {
        result = undefined;
    }

    if (typeof result === "undefined" || Number.isNaN(result)) {
        document.getElementById("hellothere").innerText = "error!error!error!";
        document.getElementById("yeehaw").src = "images/dumb-smile.gif";
        document.getElementById("yeehaw").style.display = "block";
        return "error!error!error!";
    }
    return result;
}

function updateValue(character) {
    document.getElementById("username").value += character;
}

function clearCalculator() {
    document.getElementById("username").value = "";
    document.getElementById("hellothere").innerText = "";
    document.getElementById("yeehaw").style.display = "none";
}

// File Reader
document.getElementById("fileInput").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const fileText = e.target.result.trim();
            document.getElementById("username").value = fileText;
        };
        reader.readAsText(file);
    }
});
</script>
</body>
</html>

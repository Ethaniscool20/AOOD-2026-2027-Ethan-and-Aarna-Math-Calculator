function cos(deg) { return Math.cos(deg * (Math.PI / 180)); }

//good ol gemini gave me this code to read files

document.addEventListener("DOMContentLoaded", function() {
  const readButton = document.getElementById("readButton");
  
  if (!readButton) {
    console.error("Could not find the button! Make sure your HTML has id='readButton'");
    return;
  }

  readButton.addEventListener("click", function() {
    console.log("Button was clicked!");
    
    const fileInput = document.getElementById("fileInput");
    if (!fileInput) {
      console.error("Could not find fileInput element!");
      return;
    }

    const file = fileInput.files[0];
    if (!file) {
      alert("Please choose a file first using 'Choose File'!");
      return;
    }

    console.log("File selected:", file.name);

    const reader = new FileReader();
    
    reader.onload = function(e) {
      const fileText = e.target.result.trim();
      console.log("File contents read successfully:", fileText);
      
      try {
        const solvedResult = eval(fileText);
        console.log("Calculated result:", solvedResult);
        
        // This puts the solved answer directly into your <h1> tag on the screen!
        const heading = document.querySelector("h1");
        if (heading) {
          heading.innerText = "Result: " + solvedResult;
        }
        
      } catch (error) {
        console.error("Math evaluation failed:", error);
        alert("Error in math expression: " + error.message);
      }
    };
    
    reader.onerror = function(e) {
      console.error("FileReader failed:", e);
    };

    reader.readAsText(file);
  });
});



}

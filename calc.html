document.getElementById("fileInput").addEventListener("change", function(event) {
  const file = event.target.files[0];
  
  if (file) {
    const reader = new FileReader();
    
    // Read the text inside the file and place it in the text input box
    reader.onload = function(e) {
      const fileText = e.target.result.trim();
      document.getElementById("username").value = fileText;
      
      // Update global equation variable if you use one
      if (typeof equation !== "undefined") {
        equation = fileText;
      }
    };
    
    reader.readAsText(file);
  }
});
